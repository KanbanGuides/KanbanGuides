# This workflow is managed by gh actions-lock.

name: Build & Release (KanbanGuides)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guide-site:
    name: Guide site
    uses: nkdAgility/OpenGuidePlatform/.github/workflows/guide-site-build.yaml@v1
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source-path: site
      deploy: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_POND_0D8225910 }}
